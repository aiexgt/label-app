version: '3.8'

services:
  web:
    build: .
    expose:
      - "3000"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-label_db}
      - SESSION_SECRET=${SESSION_SECRET:-labelappsecret2026}
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      # Volumen nombrado para que Coolify lo gestione sin depender del path local
      - label_uploads:/app/public/uploads

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-label_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data:
  label_uploads:
